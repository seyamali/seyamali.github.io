<div class="mb-32 text-center animate-luxury-slide-up">
    <div
        class="inline-block px-5 py-2 mb-6 text-[10px] font-extrabold tracking-[0.4em] uppercase rounded-full bg-accent/5 text-accent border border-accent/10 backdrop-blur-sm">
        {{ title }}
    </div>
    <h2 class="text-4xl md:text-7xl font-extrabold text-text-main tracking-tighter leading-tight mb-8 animate-reveal">
        @if (safeSubtitle) {
        <span [innerHTML]="safeSubtitle"></span>
        } @else {
        Detailed <span class="text-gradient font-black italic">Insights</span>
        }
    </h2>
    <div class="flex justify-center items-center gap-4 opacity-30">
        <div class="h-px w-12 bg-gradient-to-r from-transparent to-text-main"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-text-main"></div>
        <div class="h-px w-12 bg-gradient-to-l from-transparent to-text-main"></div>
    </div>
</div>
