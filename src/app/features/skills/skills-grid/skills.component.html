<section id="skills" class="relative py-32 bg-bg-base transition-colors duration-700 overflow-hidden">
    <!-- Decorative Accents -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-[radial-gradient(circle_at_center,var(--accent)_0%,transparent_70%)] opacity-[0.02]">
    </div>

    <div class="container relative mx-auto px-6">
        <app-section-header title="Technical Ecosystem"
            subtitle="My specialized <span class='text-gradient font-black'>toolset</span> for high-impact dev"></app-section-header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 md:gap-12">
            @for (group of skills; track group.category) {
            <div class="group relative card-luxury p-1 md:p-1 overflow-hidden transition-all duration-700 animate-luxury-slide-up"
                [style.animation-delay]="$index * 0.15 + 's'">

                <!-- Inner Card Container -->
                <div
                    class="relative z-10 h-full p-8 md:p-12 rounded-[1.9rem] bg-surface transition-colors duration-700 overflow-hidden group-hover:bg-bg-base">

                    <!-- Decorative Background Glow -->
                    <div
                        class="absolute -top-12 -right-12 w-40 h-40 bg-accent/10 rounded-full blur-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-700">
                    </div>

                    <div class="flex items-center justify-between mb-12">
                        <!-- Luxury Floating Icon Container -->
                        <div class="relative">
                            <div
                                class="absolute inset-0 bg-accent/20 rounded-2xl blur-xl opacity-0 group-hover:opacity-100 transition-all duration-700 scale-150">
                            </div>
                            <div
                                class="relative w-14 h-14 flex items-center justify-center rounded-2xl bg-bg-base border border-black/[0.03] dark:border-white/[0.05] text-accent shadow-luxury group-hover:bg-accent group-hover:text-white transition-all duration-700 group-hover:-translate-y-2 group-hover:rotate-6">
                                <i class="fas fa-terminal text-2xl"></i>
                            </div>
                        </div>

                        <!-- Counter or Category Badge -->
                        <span
                            class="text-[10px] font-black uppercase tracking-[0.4em] text-text-muted/30 group-hover:text-accent/40 transition-colors">
                            Tech Stack 0{{$index + 1}}
                        </span>
                    </div>

                    <h3
                        class="text-3xl font-extrabold text-text-main tracking-tighter mb-10 transition-all duration-500 group-hover:translate-x-2">
                        {{ group.category }}
                        <div class="h-1 w-8 bg-accent rounded-full mt-2 transition-all duration-700 group-hover:w-20">
                        </div>
                    </h3>

                    <div class="flex flex-wrap gap-3">
                        @for (skill of group.items; track skill) {
                        <div class="relative group/skill animate-luxury-fade-in"
                            [style.animation-delay]="($index * 0.05) + 0.3 + 's'">
                            <!-- Skill Tag - Luxury Obsidian/Glass Style -->
                            <span
                                class="relative block px-5 py-2.5 text-xs font-bold text-text-muted rounded-xl border border-black/[0.03] dark:border-white/[0.05] bg-bg-base overflow-hidden transition-all duration-500 group-hover/skill:text-white group-hover/skill:shadow-glow group-hover/skill:-translate-y-1">
                                <!-- Reflective Layer -->
                                <div
                                    class="absolute inset-0 bg-accent translate-y-full group-hover/skill:translate-y-0 transition-transform duration-500 ease-out">
                                </div>
                                <span class="relative z-10">{{ skill }}</span>
                            </span>
                        </div>
                        }
                    </div>
                </div>

                <!-- Card Outer Glow / Border Reflection -->
                <div
                    class="absolute inset-0 rounded-[2rem] border-2 border-transparent group-hover:border-accent/20 transition-all duration-700 z-0">
                </div>
            </div>
            }
        </div>
    </div>
</section>
